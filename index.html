<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phi Phụng Fit</title>
<meta name="description" content="90 ngày chăm sóc bản thân">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phi Phụng Fit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; overscroll-behavior-y: none; }
body { margin: 0; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
input, textarea, .msg, .note, p { -webkit-user-select: text; user-select: text; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: một cột điện thoại (tối đa 480px) kiểu bảng đo hiệu suất — nền đen, vòng chỉ số lớn,
   mỗi chỉ số một màu riêng luôn kèm nhãn chữ; thanh tab cố định dưới cùng + nút ghi nhanh. */
:root {
  --bg: #050607; --surface: #0f1113; --surface-2: #171a1d; --surface-3: #1f2327; --line: #262a2f;
  --fg: #f3f5f6; --muted: #949ca3; --faint: #5f676e;
  --kcal: #ffb27a; --pro: #62e394; --carb: #ffd666; --fat: #c9a8ff; --water: #61c9ff;
  --brand: #ff8fb4; --warn: #ffc35a; --danger: #ff6464; --ok: #62e394;
  --btn-bg: #f3f5f6; --btn-fg: #050607; --scrim: rgba(0, 0, 0, .72);
  --ring-track: #22262a;
  --f-num: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px; --r-ctl: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f5; --surface: #ffffff; --surface-2: #eef0f2; --surface-3: #e3e6e9; --line: #dfe2e6;
    --fg: #0c0e10; --muted: #5a636b; --faint: #8a939a;
    --kcal: #c45c12; --pro: #138a42; --carb: #946e00; --fat: #7a4fd1; --water: #0a7fbe;
    --brand: #d42f6b; --warn: #a15f00; --danger: #c62828; --ok: #138a42;
    --btn-bg: #0c0e10; --btn-fg: #ffffff; --scrim: rgba(10, 12, 14, .45); --ring-track: #e4e7ea;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f5; --surface: #ffffff; --surface-2: #eef0f2; --surface-3: #e3e6e9; --line: #dfe2e6;
  --fg: #0c0e10; --muted: #5a636b; --faint: #8a939a;
  --kcal: #c45c12; --pro: #138a42; --carb: #946e00; --fat: #7a4fd1; --water: #0a7fbe;
  --brand: #d42f6b; --warn: #a15f00; --danger: #c62828; --ok: #138a42;
  --btn-bg: #0c0e10; --btn-fg: #ffffff; --scrim: rgba(10, 12, 14, .45); --ring-track: #e4e7ea;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input[type="number"] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 168px; display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 16px 8px; display: flex; align-items: center; gap: 10px; }
.top .mascot { width: 34px; height: 34px; flex: none; }
.top-text { flex: 1; min-width: 0; }
.top-text .eyebrow { display: block; }
.top-text h1 { font-size: 19px; font-weight: 700; }
.sync { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.on i { background: var(--ok); }
.sync.err i { background: var(--warn); }

.eyebrow { font-family: var(--f-num); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-head h2 { font-family: var(--f-num); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.card.flat { background: transparent; border-style: dashed; }
.section-title { font-family: var(--f-num); font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* Dials */
.dials { display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: end; gap: 6px; padding: 18px 8px 14px; background: radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--surface)); }
.dial { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; background: none; border: 0; padding: 0; }
.dial svg { width: 100%; max-width: 150px; height: auto; display: block; }
.dial .lbl { font-family: var(--f-num); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.dial .sub { font-size: 12px; color: var(--muted); }
.ring-track { stroke: var(--ring-track); }
.ring-val { transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
.ring-text { font-family: var(--f-num); font-weight: 700; fill: var(--fg); }
.ring-unit { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.mini-dials { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mini-dials .dial svg { max-width: 76px; }
.c-kcal { color: var(--kcal); } .c-pro { color: var(--pro); } .c-carb { color: var(--carb); } .c-fat { color: var(--fat); } .c-water { color: var(--water); } .c-brand { color: var(--brand); }
.s-kcal { stroke: var(--kcal); } .s-pro { stroke: var(--pro); } .s-carb { stroke: var(--carb); } .s-fat { stroke: var(--fat); } .s-water { stroke: var(--water); } .s-brand { stroke: var(--brand); }

/* Stats */
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font-family: var(--f-num); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Bars */
.bar { height: 8px; border-radius: 99px; background: var(--ring-track); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: currentColor; transition: width .6s ease; }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .5; }
.macro-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.macro-row .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

/* Pills / chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.k { color: var(--kcal); } .chip.p { color: var(--pro); } .chip.c { color: var(--carb); } .chip.f { color: var(--fat); } .chip.w { color: var(--water); }
.chip.warn { color: var(--warn); } .chip.danger { color: var(--danger); } .chip.ok { color: var(--ok); } .chip.brand { color: var(--brand); }
.pcf { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 0 var(--line); }
.subtabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 15; background: var(--bg); padding-block: 4px; }

/* Buttons */
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn.brand { background: var(--brand); border-color: var(--brand); color: #1a0710; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns > .btn { flex: 1 1 auto; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn.boxed { background: var(--surface-2); border: 1px solid var(--line); }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; font-size: 13px; min-height: 32px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 46px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-2); padding: 10px 12px; font-size: 16px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
.form-error { color: var(--danger); font-size: 13px; font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; font-weight: 700; flex: none; }
.stepper input { width: 84px; text-align: center; min-height: 40px; padding: 6px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.box { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; transition: .15s; }
.check input:checked + .box, .box.on { background: var(--ok); border-color: var(--ok); color: #04210f; }
.check input:focus-visible + .box { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); transition: .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); transition: .2s; }
.switch input:checked + i { background: var(--ok); }
.switch input:checked + i::after { transform: translateX(20px); background: #fff; }
.switch input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
.thumb { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 24px; }
.thumb.lg { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.item-sub { font-size: 12px; color: var(--muted); }
.clamp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Recipe / food cards */
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-width: 0; }
.rcard .art { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; display: grid; place-items: center; font-size: 44px; background: radial-gradient(circle at 50% 35%, var(--surface-3), var(--surface-2)); position: relative; }
.rcard .art .fav { position: absolute; top: 6px; right: 8px; font-size: 14px; color: var(--brand); }
.rcard .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.rcard .kc { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--kcal); line-height: 1; }
.rcard .kc small { font-size: 12px; color: var(--muted); font-family: var(--f-body); font-weight: 500; }
.mac3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 11px; }
.mac3 span { display: flex; flex-direction: column; background: var(--surface-2); border-radius: 8px; padding: 4px 6px; }
.mac3 b { font-family: var(--f-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.nut4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nut4 div { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nut4 b { font-family: var(--f-num); font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
.nut4 span { font-size: 11px; color: var(--muted); }

/* Meal plan */
.daystrip { display: flex; gap: 6px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
.daystrip::-webkit-scrollbar { display: none; }
.daybtn { flex: none; width: 52px; min-height: 62px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: center; }
.daybtn .d { font-family: var(--f-num); font-weight: 700; font-size: 20px; line-height: 1; }
.daybtn .w { font-size: 11px; color: var(--muted); }
.daybtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.daybtn[aria-pressed="true"] .w { color: var(--bg); opacity: .7; }
.daybtn.today { border-color: var(--brand); }
.meal { display: flex; gap: 12px; align-items: flex-start; }
.meal-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.done-tag { color: var(--ok); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

/* Grocery */
.g-row { border-bottom: 1px solid var(--line); }
.g-row:last-child { border-bottom: 0; }
.g-main { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-height: 56px; }
.g-check { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: transparent; padding: 0; }
.g-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.g-row.bought .g-name { text-decoration: line-through; color: var(--muted); }
.g-row.have .g-name { color: var(--muted); }
.g-qty { font-family: var(--f-num); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.g-qty small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.g-detail { padding: 0 0 14px 54px; display: flex; flex-direction: column; gap: 10px; }
.g-group { font-family: var(--f-num); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--muted); padding-top: 8px; }
.progress-big { display: flex; align-items: baseline; gap: 6px; }
.progress-big .num { font-size: 40px; }

/* Water bottle */
.bottle-wrap { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.bottle { width: 96px; height: 150px; }
.wave { animation: wave 3.2s linear infinite; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(-80px); } }
.quick4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick4 .btn { padding: 0 4px; font-family: var(--f-num); font-size: 17px; font-weight: 700; }

/* Alerts */
.alert { border-radius: var(--r-card); padding: 14px 16px; display: flex; gap: 12px; border: 1px solid; }
.alert h3 { font-size: 15px; margin-bottom: 2px; }
.alert p { font-size: 14px; }
.alert.warning { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.alert.warning svg { color: var(--warn); }
.alert.emergency { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--surface)); }
.alert.emergency svg { color: var(--danger); }
.alert.info { border-color: var(--line); background: var(--surface-2); }
.alert.info svg { color: var(--water); }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* Chart */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.ch-band { fill: var(--ok); opacity: .14; }
.ch-goal { stroke: var(--brand); stroke-dasharray: 4 4; stroke-width: 1.5; fill: none; }
.ch-line { stroke: var(--fg); stroke-width: 2; fill: none; }
.ch-avg { stroke: var(--water); stroke-width: 2; fill: none; }
.ch-trend { stroke: var(--carb); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.ch-pt { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
.ch-pt.sel { fill: var(--fg); }
.ch-lbl { fill: var(--fg); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.ch-lbl-ok { fill: var(--ok); font-size: 10px; font-family: var(--f-body); }
.ch-lbl-goal { fill: var(--brand); font-size: 10px; font-family: var(--f-body); }
.ch-hit { fill: transparent; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; background: currentColor; }
.bars7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; }

const FOOD = Object.fromEntries(FOODS.map((f) => [f.id, f]));
const RECIPE = Object.fromEntries(RECIPES.map((r) => [r.id, r]));

const r1 = (x) => Math.round(x * 10) / 10;
const zero = () => ({ k: 0, p: 0, c: 0, f: 0, fb: 0 });

/** Làm tròn gram: dưới 20 g giữ 1 g, còn lại bước 5 g. */
function roundG(g) {
  if (!isFinite(g) || g <= 0) return 0;
  return g < 20 ? Math.max(1, Math.round(g)) : Math.round(g / 5) * 5;
}

/** Dinh dưỡng của `grams` thực phẩm. Trả về null nếu thực phẩm chưa xác minh. */
function nutrOf(foodId, grams) {
  const f = FOOD[foodId];
  if (!f || !f.ver) return null;
  const m = grams / 100;
  return { k: f.k * m, p: f.p * m, c: f.c * m, f: f.f * m, fb: (f.fb || 0) * m };
}

function addN(a, b) {
  if (!b) return a;
  return { k: a.k + b.k, p: a.p + b.p, c: a.c + b.c, f: a.f + b.f, fb: a.fb + b.fb };
}
function scaleN(a, m) {
  return { k: a.k * m, p: a.p * m, c: a.c * m, f: a.f * m, fb: a.fb * m };
}
function roundN(a) {

async function groceryPDF(text, filename) {
  toast("Đang tạo PDF…");
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try { await document.fonts.load('600 30px "Be Vietnam Pro"'); await document.fonts.load('30px "Be Vietnam Pro"'); } catch {}
    const W = 1240, H = 1754, M = 96, LH = 46;
    const pages = [];
    let cv, cx, y;
    const page = () => { cv = document.createElement("canvas"); cv.width = W; cv.height = H; cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, W, H); cx.fillStyle = "#0c0e10"; cx.textBaseline = "top"; y = M; pages.push(cv); };

    lines.forEach((ln, i) => {
      const head = i === 0 || (ln && ln === ln.toUpperCase() && !/^[☐☑◻]/.test(ln) && !/\d/.test(ln.slice(0, 2)));
      cx.font = `${head ? "700" : "400"} ${i === 0 ? 40 : head ? 30 : 28}px "Be Vietnam Pro", Arial, sans-serif`;
      const words = ln.split(" ");
      let cur = "";
      const out = [];
      for (const w of words) { const t = cur ? cur + " " + w : w; if (cx.measureText(t).width > W - 2 * M && cur) { out.push(cur); cur = w; } else cur = t; }
      out.push(cur);
      for (const o of out) { if (y + LH > H - M) page(); cx.font = `${head ? "700" : "400"} ${i === 0 ? 40 : head ? 30 : 28}px "Be Vietnam Pro", Arial, sans-serif`; cx.fillText(o, M, y); y += i === 0 ? 60 : LH; }
    });
    const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    pages.forEach((p, i) => { if (i) pdf.addPage(); pdf.addImage(p.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 595.28, 841.89); });
    await saveFile(filename, pdf.output("blob"));
  } catch { toast("Không tạo được PDF lúc này"); }
}

  g += `<line class="ch-goal" x1="${L}" x2="${W - R}" y1="${y(s.goalKg)}" y2="${y(s.goalKg)}"/><text class="ch-lbl-goal" x="${W - R - 2}" y="${y(s.goalKg) - 4}" text-anchor="end">Mong muốn ${s.goalKg}</text>`;

  pts.forEach((p, i) => { g += `<circle class="ch-pt ${UI.wsel === p.date ? "sel" : ""}" cx="${x(p.day)}" cy="${y(p.kg)}" r="${UI.wsel === p.date ? 5 : 3.5}"/><circle class="ch-hit" data-act="ch-pt" data-v="${p.date}" cx="${x(p.day)}" cy="${y(p.kg)}" r="12"><title>${dm(p.date)}: ${p.kg} kg</title></circle>`; });

function reportMonth() {
  const s = ST(), lw = latestWeight();

  const weeks = [0, 1, 2, 3].map((w) => {
    const ds = days.slice(w * 7 + 2, w * 7 + 9).map(dayStats).filter((x) => x.slots.size >= 3);
    const av = (k) => (ds.length ? ds.reduce((a, x) => a + x.total[k], 0) / ds.length : null);
    return { p: av("p"), c: av("c"), f: av("f"), n: ds.length };
  });
  const freq = {};
  for (const d of days) for (const m of mealsOn(d)) freq[m.name] = (freq[m.name] || 0) + 1;
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const from = days[0];
  const spent = (S.profile.purchases || []).filter((p) => p.date >= from).reduce((a, p) => a + (p.vnd || 0), 0);

function healthTrend(n) {
  const days = Array.from({ length: n }, (_, i) => addDays(today(), -(n - 1) + i));
  const hs = days.map((d) => { const l = healthOn(d); return l[l.length - 1] || null; });
  const withPain = hs.filter((h) => h?.backPain != null);
  if (!hs.some(Boolean)) return `<section class="card"><div class="card-head"><h2>Sức khỏe</h2></div><p class="small muted">Chưa có ghi nhận sức khỏe trong ${n} ngày qua.</p><button class="btn sm" data-act="quick-health">Ghi sức khỏe</button></section>`;
  const W = 340, H = 80;
  const x = (i) => 8 + (i / (n - 1)) * (W - 16), y = (v) => 8 + ((10 - v) / 10) * (H - 22);
  let path = "";
  hs.forEach((h, i) => { if (h?.backPain != null) path += `${path ? "L" : "M"}${x(i)},${y(h.backPain)} `; });
  const sleep = hs.filter((h) => h?.sleep != null);
  const numb = hs.filter((h) => h?.handNumbness || h?.legWeakness).length;
  return `<section class="card"><div class="card-head"><h2>Sức khỏe ${n} ngày</h2></div>
    ${withPain.length ? `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mức đau lưng"><line class="ch-grid" x1="8" x2="${W - 8}" y1="${y(5)}" y2="${y(5)}"/>${withPain.length > 1 ? `<path d="${path}" style="stroke:var(--fat);stroke-width:2;fill:none"/>` : ""}${hs.map((h, i) => (h?.backPain != null ? `<circle cx="${x(i)}" cy="${y(h.backPain)}" r="3" style="fill:var(--fat)"/>` : "")).join("")}<text class="ch-axis" x="8" y="${H - 4}">Đau lưng 0–10 · ${withPain.length} ngày có ghi</text></svg></div>` : ""}
    <div class="kv"><span>Ngủ trung bình</span><b>${sleep.length ? fmt(sleep.reduce((a, h) => a + h.sleep, 0) / sleep.length, 1) + " giờ" : "Chưa ghi"}</b></div>
    <div class="kv"><span>Ngày có tê tay / yếu chân</span><b>${numb}</b></div>
    ${numb ? `<p class="small c-carb">Bạn đã ghi nhận tê hoặc yếu tay chân. Hãy đi khám sớm nếu chưa được đánh giá; ứng dụng không kết luận nguyên nhân.</p>` : ""}</section>`;
}

function journeyGrid() {

}

    else { msg.content = e.text ? e.text + "\n\n(Bị gián đoạn) " + coachErr(e) : coachErr(e); msg.err = true; delete msg.pending; }

function shapeMarketAI(data, usePantry) {

      if (ok) left[pu.buyId] -= pu.asBought;
      items.push({ id, grams, have: ok, pu });
    }
    let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 };
    for (const it of items) t = addN(t, nutrOf(it.id, it.grams));
    const steps = (Array.isArray(d.steps) ? d.steps : []).map(String).filter((s) => !isBannedText(s)).slice(0, 8);

  SHEET_CTX = c;

  openSheet("Sửa món", () => {

      <p class="form-error" id="em-err" hidden></p><button class="btn primary block" data-act="em-save">Lưu thay đổi</button>`;

function saveEditMeal() {
  const c = SHEET_CTX, m = c.m;
  const patch = { name: $("#em-name").value.trim() || m.name, slot: $("#em-slot").value };
  if (c.byItems) {
    let t = { k: 0, p: 0, c: 0, f: 0, fb: 0 };
    for (const it of c.items) { if (!(it.g > 0)) return err("em-err", "Gram cần lớn hơn 0."); t = addN(t, nutrOf(it.id, it.g)); }
    Object.assign(patch, roundN(t), { items: c.items });
  } else {
    const v = {};
    for (const k of ["k", "p", "c", "f"]) { v[k] = num($("#em-" + k).value); if (!(v[k] >= 0 && v[k] <= 4000)) return err("em-err", "Các giá trị cần là số không âm."); }
    Object.assign(patch, { k: Math.round(v.k), p: r1(v.p), c: r1(v.c), f: r1(v.f) });
  }
  updateMeal(m.id, c.date, patch);
  closeSheet(); toast("Đã lưu"); render();
}

let reminderShown = "";
function reminderTick() {
  const r = ST().reminders;
  if (!r.on) return;
  const d = new Date(), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (r.times.includes(t) && reminderShown !== today() + t) { reminderShown = today() + t; toast("Đến giờ uống nước rồi, Phụng ơi 💧"); }
}
function watchShared() {
  if (!SYNC.db) return;
  try {
    SYNC.db.collection("shared").onSnapshot((snap) => {
      UI.shared = snap.docs.filter((d) => d.exists && d.id !== SYNC.uid).map((d) => d.data());
      if (UI.tab === "me") scheduleRender();
    }, () => {});
  } catch {}
}
function boot() {
  const hadLocal = loadLocal();
  try { const t = localStorage.getItem("ppfit-tab"); if (PAGES[t]) UI.tab = t; } catch {}
  applyTheme();
  UI.planDay = journeyDay();
  document.body.insertAdjacentHTML("beforeend", `<nav class="nav" aria-label="Điều hướng chính"><div class="nav-in">${NAV.map(([k, t, i]) => `<button data-act="tab" data-v="${k}">${ic(i, 22)}<span>${t}</span></button>`).join("")}</div></nav><button class="fab" data-act="fab" aria-label="Ghi nhanh">${ic("plus", 22)} Ghi nhanh</button>`);
  render();
  const splash = $("#splash");
  const t0 = Date.now();
  const done = () => {
    UI.planDay = journeyDay();
    applyTheme();
    render();
    setTimeout(() => { splash?.classList.add("out"); setTimeout(() => splash?.remove(), 500); if (!ST().onboarded) showOnboarding(); }, Math.max(0, 900 - (Date.now() - t0)));
  };
  if (hadLocal && ST().onboarded) { done(); initSync().then(watchShared); }
  else { SYNC.onReady.push(done); initSync().then(watchShared); }
  SYNC.onReady.push(() => { if (!ST().startDate && ST().onboarded) { ST().startDate = today(); save("profile"); } });
  initSample();
  if (!IN_CLAUDE) navigator.storage?.persist?.().catch(() => {});
  setInterval(reminderTick, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleRender(); });
}
boot();

</script>
<script>

        const w = reg.installing;
        w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("Đã có bản cập nhật — mở lại ứng dụng để dùng bản mới"); });
      });
    }).catch(() => {});
  });
}
</script>
